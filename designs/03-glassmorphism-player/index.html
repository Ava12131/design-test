<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glassmorphism Music Player - Design Test</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="background">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>
    
    <div class="player-card">
        <div class="top-bar">
            <button class="btn-icon"><i class="fas fa-chevron-down"></i></button>
            <span class="now-playing">正在播放</span>
            <button class="btn-icon"><i class="fas fa-bars"></i></button>
        </div>
        
        <div class="album-art">
            <div class="art-container">
                <img src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?q=80&w=1000&auto=format&fit=crop" alt="Album Art">
            </div>
        </div>
        
        <div class="song-info">
            <h2 class="song-title">Midnight City</h2>
            <p class="artist-name">M83 - Hurry Up, We're Dreaming</p>
        </div>
        
        <div class="progress-container">
            <div class="time-info">
                <span>1:24</span>
                <span>4:03</span>
            </div>
            <div class="progress-bar">
                <div class="progress"></div>
                <div class="progress-dot"></div>
            </div>
        </div>
        
        <div class="controls">
            <button class="btn-secondary"><i class="fas fa-random"></i></button>
            <button class="btn-primary"><i class="fas fa-step-backward"></i></button>
            <button class="btn-play"><i class="fas fa-play"></i></button>
            <button class="btn-primary"><i class="fas fa-step-forward"></i></button>
            <button class="btn-secondary"><i class="fas fa-redo"></i></button>
        </div>
        
        <div class="footer-actions">
            <button class="btn-icon"><i class="far fa-heart"></i></button>
            <button class="btn-icon"><i class="fas fa-share-alt"></i></button>
            <button class="btn-icon"><i class="fas fa-volume-up"></i></button>
        </div>
    </div>
</body>
</html>
