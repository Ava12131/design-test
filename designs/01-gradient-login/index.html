<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradient Minimal Login - Design Test</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background">
        <div class="circle circle-1"></div>
        <div class="circle circle-2"></div>
    </div>
    <div class="login-container">
        <form class="login-form">
            <h2>欢迎回来</h2>
            <p>请登录您的账户以继续</p>
            
            <div class="input-group">
                <label for="email">邮箱地址</label>
                <input type="email" id="email" placeholder="name@example.com" required>
            </div>
            
            <div class="input-group">
                <label for="password">密码</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            
            <div class="options">
                <label><input type="checkbox"> 记住我</label>
                <a href="#">忘记密码？</a>
            </div>
            
            <button type="submit" class="login-btn">登录</button>
            
            <div class="divider">
                <span>或者使用以下方式登录</span>
            </div>
            
            <div class="social-login">
                <button type="button" class="social-btn">Google</button>
                <button type="button" class="social-btn">GitHub</button>
            </div>
            
            <p class="signup-link">还没有账户？ <a href="#">立即注册</a></p>
        </form>
    </div>
</body>
</html>
