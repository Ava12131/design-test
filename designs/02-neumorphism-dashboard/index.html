<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neumorphism Dashboard - Design Test</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <div class="logo">
                <div class="logo-icon"></div>
                <span>DesignLab</span>
            </div>
            <nav>
                <a href="#" class="nav-item active">仪表盘</a>
                <a href="#" class="nav-item">项目管理</a>
                <a href="#" class="nav-item">团队协作</a>
                <a href="#" class="nav-item">统计分析</a>
                <a href="#" class="nav-item">系统设置</a>
            </nav>
            <div class="user-profile">
                <div class="avatar"></div>
                <div class="user-info">
                    <span class="name">Ava Zhang</span>
                    <span class="role">UI Designer</span>
                </div>
            </div>
        </aside>
        
        <main class="content">
            <header>
                <h1>欢迎回来，Ava</h1>
                <div class="search-bar">
                    <input type="text" placeholder="搜索项目...">
                </div>
            </header>
            
            <section class="stats">
                <div class="stat-card">
                    <span class="label">进行中项目</span>
                    <span class="value">12</span>
                    <div class="progress-bar"><div class="progress" style="width: 65%;"></div></div>
                </div>
                <div class="stat-card">
                    <span class="label">已完成任务</span>
                    <span class="value">84</span>
                    <div class="progress-bar"><div class="progress" style="width: 85%;"></div></div>
                </div>
                <div class="stat-card">
                    <span class="label">团队活跃度</span>
                    <span class="value">92%</span>
                    <div class="progress-bar"><div class="progress" style="width: 92%;"></div></div>
                </div>
            </section>
            
            <section class="projects">
                <h2>近期项目</h2>
                <div class="project-grid">
                    <div class="project-card">
                        <div class="project-icon">🎨</div>
                        <h3>移动端 App 重构</h3>
                        <p>优化用户体验与视觉语言</p>
                        <button class="btn-view">查看详情</button>
                    </div>
                    <div class="project-card">
                        <div class="project-icon">💻</div>
                        <h3>SaaS 后台设计</h3>
                        <p>构建高效的数据管理系统</p>
                        <button class="btn-view">查看详情</button>
                    </div>
                    <div class="project-card">
                        <div class="project-icon">📱</div>
                        <h3>社交媒体原型</h3>
                        <p>探索全新的交互模式</p>
                        <button class="btn-view">查看详情</button>
                    </div>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
